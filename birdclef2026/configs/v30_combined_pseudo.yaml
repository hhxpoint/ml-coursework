# ============================================================
# BirdCLEF 2026 — configs/v30_combined_pseudo.yaml
# v30 Recipe: Combined r4+r5 Pseudo Labels (5× more coverage)
# 
# Uses combined_pseudo_r4r5.csv (6601 clips × 10 oversample)
# vs v24's r5 only (1176 clips × 10)
# ep2 already 0.7871 — expected to exceed v24 at peak
# ============================================================

data_dir: "./data"
train_audio_dir: "./data/train_audio"
train_soundscape_dir: "./data/train_soundscapes"
test_soundscape_dir: "./data/test_soundscapes"
train_csv: "./data/train.csv"
taxonomy_csv: "./data/taxonomy.csv"
soundscape_labels_csv: "./data/train_soundscape_labels.csv"
soft_pseudo_csv: "./data/pseudo/combined_pseudo_r4r5.csv"
hard_pseudo_csv: "./data/pseudo/hard_pseudo_r5.csv"
combined_pseudo_csv: "./data/pseudo/combined_pseudo_r4r5.csv"
output_dir: "./output/v30"

sample_rate: 32000
n_fft: 1024
hop_length: 320
n_mels: 128
fmin: 50
fmax: 16000
train_duration: 10.0
infer_duration: 5.0
use_pcen: true

backbone: "tf_efficientnet_b0.ns_jft_in1k"
in_channels: 3
num_classes: 234
dropout: 0.1
gem_pool: true
gem_p_init: 3.0
dual_loss: true
dual_clip_weight: 0.5
dual_frame_weight: 0.5

seed: 42
device: "cuda"
num_workers: 4
epochs: 35
batch_size: 32
lr: 5.0e-4
warmup_epochs: 3
scheduler: "cosine"
patience: 7
use_amp: true

asl_gamma_neg: 4.0
asl_gamma_pos: 0.0
asl_clip: 0.05

mixup_alpha: 0.5
circ_shift_prob: 0.5
specaugment_time_masks: 2
specaugment_time_mask_param: 0.15
specaugment_freq_masks: 2
specaugment_freq_mask_param: 40
noise_level: 0.005
gain_min: 0.7
gain_max: 1.3
aug_filter: true
aug_filter_p: 0.3
aug_background_noise: true
aug_noise_p: 0.3

# Combined pseudo: 6601 clips × 10 oversample (5× more than v24)
clips_per_file: 3
soundscape_oversample: 5
soft_pseudo_oversample: 10
hard_pseudo_oversample: 5
combined_pseudo_oversample: 10

lmax_alpha: 0.1
lmax_radius: 1
lmax_aves_start: 72
lscale: 0.9
richness_temp: 0.15
richness_threshold: 0.5
richness_cp_blend: 0.60
richness_cp_threshold: 0.05
apply_postprocessing: true
